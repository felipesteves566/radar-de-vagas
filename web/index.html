<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de Vagas</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--star:#f59e0b;--ok:#16a34a;--warn:#b45309;--warnbg:#fef3c7;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#131c2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#243046;--accent:#60a5fa;--warn:#fbbf24;--warnbg:#3a2a07;--chip:#1e293b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin:10px 0 8px;overflow-x:auto}
.tabs button,.filters select,.filters input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters input{flex:1 1 140px;border-radius:10px}
.filters select{border-radius:10px;padding:6px 8px}
main{padding:12px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.title{font-weight:650;font-size:16px;margin:0}
.co{color:var(--muted);font-size:13px;margin-top:2px}
.stars{color:var(--star);font-size:15px;letter-spacing:1px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px}
.chip.new{background:var(--accent);color:#fff}
.alert{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:4px 8px;font-size:12.5px;margin:4px 0}
.why{color:var(--muted);font-size:12.5px}
details{margin-top:8px}
summary{color:var(--accent);cursor:pointer;font-size:13px}
.desc{white-space:pre-wrap;font-size:13.5px;margin-top:6px;max-height:50vh;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions a,.actions button{flex:1;text-align:center;font:inherit;font-size:14px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.actions a{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.markline{font-size:13px;margin-top:8px;color:var(--ok)}
.markline.d{color:var(--muted)}
.reason{display:none;margin-top:8px;gap:6px}
.reason.show{display:flex}
.reason input{flex:1;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.reason button{font:inherit;padding:8px 12px;border-radius:10px;border:0;background:var(--ink);color:var(--bg)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 16px 30px}
footer button{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;margin:4px}
</style>
</head>
<body>
<header>
  <h1>Radar de Vagas</h1>
  <div class="sub" id="sub">Carregando…</div>
  <div class="tabs" id="tabs">
    <button data-t="novas" class="on">Novas</button>
    <button data-t="todas">Abertas</button>
    <button data-t="inscritas">Inscrevi</button>
    <button data-t="descartadas">Descartadas</button>
  </div>
  <div class="filters">
    <input id="q" type="search" placeholder="Buscar cargo, empresa, cidade">
    <select id="min" aria-label="Estrelas mínimas">
      <option value="1">★ todas</option><option value="2">★★ ou mais</option><option value="3" selected>★★★ ou mais</option><option value="4">★★★★ ou mais</option><option value="5">★★★★★</option>
    </select>
    <select id="model" aria-label="Modelo"><option value="">Qualquer modelo</option><option>remoto</option><option>híbrido</option><option>presencial</option></select>
  </div>
</header>
<main id="list"></main>
<footer>
  <div id="foot"></div>
  <div>Inscrevi e descartes ficam salvos neste aparelho.</div>
  <button id="exp">Copiar backup</button><button id="imp">Restaurar backup</button>
</footer>
<script>
const KEY = 'radar-marcas-v1';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let marks = store.get(KEY, {}), data = { jobs: [] }, tab = 'novas';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtAge = iso => { if (!iso) return null; const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000); return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`; };
const fmtWhen = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const isNew = j => !marks[j.id] && Date.now() - Date.parse(j.firstSeenAt) < 2 * 864e5; // achada nas últimas 48 h
const SRC = { gupy: 'Gupy', linkedin: 'LinkedIn', greenhouse: 'Greenhouse', lever: 'Lever', ashby: 'Ashby', inhire: 'InHire' };

function visible() {
  const q = $('q').value.trim().toLowerCase(), min = +$('min').value, model = $('model').value;
  return data.jobs.filter(j => {
    const m = marks[j.id];
    if (tab === 'inscritas') { if (m?.s !== 'a') return false; }
    else if (tab === 'descartadas') { if (m?.s !== 'd') return false; }
    else { if (m) return false; if (tab === 'novas' && !isNew(j)) return false; if (j.stars < min) return false; }
    if (model && j.model !== model) return false;
    if (q && !`${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function card(j) {
  const m = marks[j.id];
  const age = fmtAge(j.publishedAt);
  return `<article class="card" data-id="${esc(j.id)}">
    <div class="top"><div><p class="title">${esc(j.title)}</p><div class="co">${esc(j.company)}${j.location ? ' · ' + esc(j.location) : ''}</div></div>
    <div class="stars" title="Encaixe">${'★'.repeat(j.stars)}${'☆'.repeat(5 - j.stars)}</div></div>
    <div class="meta">${isNew(j) ? '<span class="chip new">nova</span>' : ''}<span class="chip">${SRC[j.source] || j.source}</span>${j.model ? `<span class="chip">${esc(j.model)}</span>` : ''}${age ? `<span class="chip">publicada ${age}</span>` : ''}</div>
    ${j.alerts.map(a => `<div class="alert">⚠ ${esc(a)}</div>`).join('')}
    <div class="why">${j.reasons.map(esc).join(' · ')}</div>
    <details><summary>Ver descrição</summary><div class="desc">${esc(j.description)}</div></details>
    ${m ? `<div class="markline ${m.s === 'd' ? 'd' : ''}">${m.s === 'a' ? '✓ Inscrevi' : '✕ Descartada'} em ${fmtWhen(m.at)}${m.r ? ' — ' + esc(m.r) : ''}</div>` : ''}
    <div class="actions"><a href="${esc(j.url)}" target="_blank" rel="noopener">Abrir vaga</a>
    ${m ? `<button data-a="undo">Desfazer</button>` : `<button data-a="apply">Inscrevi</button><button data-a="discard">Descartar</button>`}</div>
    <div class="reason"><input placeholder="Motivo do descarte (ex.: presencial longe)"><button data-a="confirm">OK</button></div>
  </article>`;
}

function render() {
  const v = visible();
  $('list').innerHTML = v.length ? v.map(card).join('') : `<div class="empty">${tab === 'novas' ? 'Nenhuma vaga nova nas últimas 48 horas. Veja a aba Abertas.' : 'Nenhuma vaga aqui com esses filtros.'}</div>`;
  const open = data.jobs.filter(j => !marks[j.id]);
  $('sub').textContent = `${open.filter(isNew).length} novas · ${open.length} abertas · atualizado ${data.generatedAt ? fmtWhen(data.generatedAt) : '—'}`;
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const el = b.closest('.card'), id = el.dataset.id, a = b.dataset.a;
  if (a === 'apply') marks[id] = { s: 'a', at: new Date().toISOString() };
  else if (a === 'discard') { el.querySelector('.reason').classList.add('show'); el.querySelector('.reason input').focus(); return; }
  else if (a === 'confirm') { const r = el.querySelector('.reason input').value.trim(); if (!r) { el.querySelector('.reason input').placeholder = 'Escreva o motivo para descartar'; return; } marks[id] = { s: 'd', at: new Date().toISOString(), r }; }
  else if (a === 'undo') delete marks[id];
  store.set(KEY, marks); render();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); render(); });
['q', 'min', 'model'].forEach(id => $(id).addEventListener('input', render));
$('exp').onclick = async () => { const t = JSON.stringify(marks); try { await navigator.clipboard.writeText(t); alert('Backup copiado. Cole num lugar seguro (ex.: notas).'); } catch { prompt('Copie o backup:', t); } };
$('imp').onclick = () => { const t = prompt('Cole o backup:'); if (!t) return; try { marks = { ...marks, ...JSON.parse(t) }; store.set(KEY, marks); render(); } catch { alert('Backup inválido.'); } };

fetch('vagas.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  data = d;
  const src = Object.entries(d.sources || {}).map(([k, v]) => `${SRC[k] || k}: ${v.lastRunAt ? fmtWhen(v.lastRunAt) : '—'}${v.errors ? ` (${v.errors} avisos)` : ''}`).join(' · ');
  $('foot').textContent = `Última coleta por fonte — ${src}`;
  render();
}).catch(() => { $('sub').textContent = 'Não consegui carregar as vagas. Tente de novo em instantes.'; });
</script>
</body>
</html>
